[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stonks-trading-os"
version = "1.0.0"
description = "A persistent, event-driven AI trading operating system with calibrated predictions and real-time reasoning."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kushal Saha", email = "kushalsaha789@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "fastapi>=0.100.0,<1.0.0",
    "uvicorn>=0.20.0,<1.0.0",
    "pandas>=2.0.0,<3.0.0",
    "numpy>=1.24.0,<2.0.0",
    "yfinance>=0.2.0,<2.0.0",
    "scikit-learn>=1.2.0,<2.0.0",
    "catboost>=1.2.0,<2.0.0",
    "xgboost>=1.7.0,<4.0.0",
    "lightgbm>=3.3.0,<5.0.0",
    "joblib>=1.2.0,<2.0.0",
    "apscheduler>=3.10.0,<4.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "transformers>=4.30.0,<6.0.0",
    "huggingface-hub>=0.15.0,<2.0.0",
    "psutil>=5.9.0,<8.0.0"
]

[project.scripts]
stonks = "stonks.terminal.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0"
]

[tool.black]
line-length = 100
target-version = ['py311', 'py312']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = []

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.setuptools.packages.find]
where = ["."]
include = ["stonks*"]

